name: surahyaseen
description: Surah Yaseen - offline Islamic app with Arabic, Urdu and English text, audio, bookmarks and Tasbeeh.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.11
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  file_picker: ^8.0.7
  path_provider: ^2.1.4
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/surah_yaseen.json
    - assets/audio/
  fonts:
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
